name: Build NC Bank Map Book

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build detailed PDF map book with TIGERweb streets
        env:
          OUTPUT_DIR: output
        run: python tools/build_with_tiger_vector_fixed.py

      - name: Verify PDF and street-map images
        run: |
          test -s output/AES_NC_Stores_Nearby_Banks_Detailed_Map.pdf
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np

          pdf = Path('output/AES_NC_Stores_Nearby_Banks_Detailed_Map.pdf')
          assert pdf.read_bytes()[:5] == b'%PDF-'
          maps = sorted(Path('output/maps').glob('*.png'))
          assert len(maps) == 12, f'Expected 12 map images; found {len(maps)}'
          for path in maps:
              arr = np.asarray(Image.open(path).convert('RGB').resize((300, 220)))
              gray = arr.mean(axis=2)
              edge = float(np.abs(np.diff(gray, axis=0)).mean() + np.abs(np.diff(gray, axis=1)).mean())
              unique = len(np.unique(arr.reshape(-1, 3), axis=0))
              assert edge > 3.0 and unique > 700, f'Map lacks street detail: {path}, edge={edge:.2f}, unique={unique}'
          print(f'PDF verified: {pdf.stat().st_size:,} bytes; {len(maps)} map images passed street-detail checks')
          PY

      - name: Package deliverables
        run: |
          cd output
          zip -r ../AES_NC_Bank_Map_Deliverables.zip .

      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: AES-NC-bank-map-deliverables
          path: |
            output/AES_NC_Stores_Nearby_Banks_Detailed_Map.pdf
            output/AES_NC_Stores_Nearby_Banks_1.5mi.csv
            output/map_data.json
            AES_NC_Bank_Map_Deliverables.zip
          if-no-files-found: error
          retention-days: 7
